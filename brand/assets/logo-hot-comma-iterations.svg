      <stop offset="1" stop-color="#FFD99B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .tile { fill: rgba(28, 31, 36, 0.72); stroke: rgba(246, 239, 228, 0.12); stroke-width: 1; }
      .label { font: 560 28px -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif; fill: rgba(246, 239, 228, 0.60); letter-spacing: 0; }
      .word { font: 760 54px -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif; fill: #F6EFE4; letter-spacing: -1px; }
      .tiny { font: 500 20px -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif; fill: rgba(246, 239, 228, 0.42); letter-spacing: 0; }
    </style>
  </defs>

