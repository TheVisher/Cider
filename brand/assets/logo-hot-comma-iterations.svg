<svg width="2400" height="1500" viewBox="0 0 2400 1500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2400" y2="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1115"/>
      <stop offset="0.55" stop-color="#15110E"/>
      <stop offset="1" stop-color="#0F1115"/>
    </linearGradient>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE2A3"/>
      <stop offset="0.36" stop-color="#F4A42B"/>
      <stop offset="0.72" stop-color="#E85D04"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="deepPeel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0C2"/>
      <stop offset="0.32" stop-color="#F4A42B"/>
      <stop offset="0.66" stop-color="#D97706"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="creamLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7E8"/>
      <stop offset="1" stop-color="#FFD99B"/>
    </linearGradient>
    <radialGradient id="hot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="scale(180 160)">
