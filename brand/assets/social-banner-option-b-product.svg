    <image href="icon-1024.png" x="0" y="0" width="210" height="210" preserveAspectRatio="xMidYMid meet"/>
    <text x="252" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="112" font-weight="700" fill="#F4A42B" letter-spacing="0">Cider</text>
    <text x="258" y="154" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="38" font-weight="500" fill="#EAEAEA" letter-spacing="0">Your Mac's living knowledge vault</text>
    <text x="258" y="212" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="30" font-weight="500" fill="#9CA3AF" letter-spacing="0">Capture links, notes, dates, contacts, and ideas before they wander off.</text>
