<svg width="2400" height="900" viewBox="0 0 2400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2400" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1115"/>
      <stop offset="0.62" stop-color="#15181E"/>
      <stop offset="1" stop-color="#1C1F24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 450) rotate(12) scale(520 360)">
      <stop offset="0" stop-color="#F4A42B" stop-opacity="0.22"/>
      <stop offset="0.54" stop-color="#D97706" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="1320" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1115" stop-opacity="0"/>
      <stop offset="1" stop-color="#0F1115" stop-opacity="0.86"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="1230" y="170" width="900" height="642" rx="34"/>
