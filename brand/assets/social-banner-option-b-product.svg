    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="32" stdDeviation="34" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="2400" height="900" fill="url(#bg)"/>
  <rect width="2400" height="900" fill="url(#glow)"/>
  <g filter="url(#shadow)" opacity="0.7">
    <rect x="1230" y="170" width="900" height="642" rx="34" fill="#1C1F24"/>
    <image href="../../website/assets/screenshots/dashboard.png" x="1230" y="170" width="900" height="642" preserveAspectRatio="xMidYMid slice" clip-path="url(#windowClip)" opacity="0.62"/>
    <rect x="1230" y="170" width="900" height="642" rx="34" fill="#0F1115" opacity="0.32"/>
  </g>
  <rect width="2400" height="900" fill="url(#fade)"/>
