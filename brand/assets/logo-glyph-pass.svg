<svg width="2400" height="1500" viewBox="0 0 2400 1500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2400" y2="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1115"/>
      <stop offset="0.55" stop-color="#15110E"/>
      <stop offset="1" stop-color="#0F1115"/>
    </linearGradient>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE2A3"/>
      <stop offset="0.38" stop-color="#F4A42B"/>
      <stop offset="0.72" stop-color="#E85D04"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="peel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1C7"/>
      <stop offset="0.45" stop-color="#F4A42B"/>
      <stop offset="1" stop-color="#FF6A3D"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DBBFF"/>
      <stop offset="1" stop-color="#7AA7FF"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .tile { fill: rgba(28, 31, 36, 0.72); stroke: rgba(246, 239, 228, 0.12); stroke-width: 1; }
      .label { font: 560 28px -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif; fill: rgba(246, 239, 228, 0.58); letter-spacing: 0; }
    </style>
  </defs>

  <rect width="2400" height="1500" fill="url(#bg)"/>
  <circle cx="260" cy="160" r="500" fill="#F4A42B" opacity="0.07"/>
  <circle cx="2150" cy="1320" r="520" fill="#7AA7FF" opacity="0.045"/>
  <text x="130" y="128" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="58" font-weight="780" fill="#F6EFE4">Abstract Glyph Pass</text>
  <text x="130" y="178" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="24" font-weight="500" fill="rgba(246, 239, 228, 0.45)">Six weird little marks. No app metaphor. No explanation. Just vibes with a job.</text>

  <g transform="translate(130 270)">
    <rect class="tile" width="620" height="470" rx="32"/>
