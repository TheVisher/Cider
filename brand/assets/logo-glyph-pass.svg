    <text x="38" y="58" class="label">E. Split Spark</text>
    <g transform="translate(310 255)" filter="url(#shadow)">
      <path d="M-98 96L-12-124c5-13 23-14 31-3l118 178c8 12-1 28-16 27L30 70-58 132c-20 14-48-13-35-36z" fill="url(#peel)"/>
      <path d="M-12-124L30 70-58 132z" fill="#FFF1C7" opacity="0.52"/>
      <path d="M30 70l107-19c8 12-1 28-16 27z" fill="url(#blue)" opacity="0.62"/>
    </g>
  </g>

  <g transform="translate(1650 870)">
    <rect class="tile" width="620" height="470" rx="32"/>
    <text x="38" y="58" class="label">F. Offset Ring</text>
    <g transform="translate(310 255)" filter="url(#shadow)">
      <ellipse cx="0" cy="0" rx="125" ry="88" fill="none" stroke="url(#peel)" stroke-width="48"/>
      <ellipse cx="-18" cy="12" rx="66" ry="46" fill="#0F1115" opacity="0.88"/>
      <path d="M-62 56C-10 33 33-10 65-70" fill="none" stroke="#FFF2C8" stroke-width="11" stroke-linecap="round" opacity="0.74"/>
      <circle cx="88" cy="-58" r="17" fill="url(#blue)"/>
