    <g transform="translate(310 255)" filter="url(#shadow)">
      <path d="M-120 4C-96-92 26-132 92-64c64 66 19 172-75 174-62 1-93-58-59-103 23-31 70-28 88 3" fill="none" stroke="url(#peel)" stroke-width="54" stroke-linecap="round"/>
      <path d="M-72 68C-6 44 48-8 86-80" fill="none" stroke="#FFF2C8" stroke-width="10" stroke-linecap="round" opacity="0.78"/>
    </g>
  </g>

  <g transform="translate(890 270)">
    <rect class="tile" width="620" height="470" rx="32"/>
    <text x="38" y="58" class="label">B. Hot Comma</text>
    <g transform="translate(310 255)" filter="url(#shadow)">
      <path d="M-72-110C28-150 118-66 87 32C64 105-18 142-85 96c-46-32-47-100-4-130 30-20 70-9 84 26-17-10-37-7-49 7-20 24-7 63 24 72 52 15 98-37 79-89-16-44-71-60-121-32z" fill="url(#peel2)"/>
      <circle cx="73" cy="-83" r="18" fill="url(#blue)"/>
    </g>
  </g>

  <g transform="translate(1650 270)">
    <rect class="tile" width="620" height="470" rx="32"/>
    <text x="38" y="58" class="label">C. Signal Curl</text>
    <g transform="translate(310 255)" filter="url(#shadow)">
      <path d="M-116 72C-76-62 34-132 130-95C57-70 15-22 4 52c45-44 98-44 137-4-74-2-120 32-139 105-37-7-76-35-118-81z" fill="url(#peel)"/>
      <path d="M-70 66C-17 20 40-19 101-50" fill="none" stroke="#FFF2C8" stroke-width="11" stroke-linecap="round" opacity="0.72"/>
    </g>
  </g>

  <g transform="translate(130 870)">
    <rect class="tile" width="620" height="470" rx="32"/>
    <text x="38" y="58" class="label">D. Little Sunspot</text>
    <g transform="translate(310 255)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="108" fill="url(#peel)"/>
      <path d="M-92 35C-24 84 63 74 106 2v106H-92z" fill="#0F1115" opacity="0.22"/>
      <path d="M-72 12C-14 47 56 29 92-35" fill="none" stroke="#FFF2C8" stroke-width="12" stroke-linecap="round" opacity="0.72"/>
      <circle cx="58" cy="-62" r="18" fill="#FFF1C7"/>
